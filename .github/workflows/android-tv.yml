name: Android TV CI

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'backend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/android-tv.yml'
      - 'ci/update-android-metadata.sh'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-tv.yml'
      - 'ci/update-android-metadata.sh'

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/android/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masjid-smart-screen-tv-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  release-apk:
    name: Publish rolling APK release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: masjid-smart-screen-tv-release
          path: build/android-apk

      - name: Publish latest Android TV release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -D -m 0644 \
            build/android-apk/app-release.apk \
            build/release/masjid-smart-screen-tv.apk
          if gh release view android-tv-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload android-tv-latest \
              'build/release/masjid-smart-screen-tv.apk#bayanDigital Android TV APK' \
              --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create android-tv-latest \
              'build/release/masjid-smart-screen-tv.apk#bayanDigital Android TV APK' \
              --title 'bayanDigital Android TV — Latest' \
              --notes 'Automatically built Android TV release.' \
              --latest=false --repo "${GITHUB_REPOSITORY}"
          fi

  deploy-server:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-apk
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: masjid-smart-screen-tv-release
          path: build/android-apk

      - name: Update server repository to this commit
        shell: bash
        run: |
          set -euo pipefail
          git -C /home/hafriz/BayanDigital fetch origin main
          git -C /home/hafriz/BayanDigital reset --hard origin/main

      - name: Install signed APK into the web application
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0644 \
            "${GITHUB_WORKSPACE}/build/android-apk/app-release.apk" \
            /home/hafriz/BayanDigital/backend/public/android/masjid-smart-screen-tv.apk
          test -s /home/hafriz/BayanDigital/backend/public/android/masjid-smart-screen-tv.apk

      - name: Synchronize Android release metadata
        shell: bash
        run: bash ci/update-android-metadata.sh
        working-directory: /home/hafriz/BayanDigital

      - name: Rebuild and redeploy application container
        shell: bash
        run: |
          set -euo pipefail
          docker compose build app
          docker compose up -d app
        working-directory: /home/hafriz/BayanDigital

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' bayandigital-app-1 2>/dev/null || true)"
            echo "[$i] health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "Application did not become healthy in time" >&2
          exit 1

      - name: Verify served APK
        shell: bash
        run: |
          set -euo pipefail
          expected="$(md5sum /home/hafriz/BayanDigital/backend/public/android/masjid-smart-screen-tv.apk | cut -d' ' -f1)"
          served="$(curl -fsS "http://localhost:7575/android/masjid-smart-screen-tv.apk" | md5sum | cut -d' ' -f1)"
          echo "expected=$expected served=$served"
          [ "$expected" = "$served" ]
